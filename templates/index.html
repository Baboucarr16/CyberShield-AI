<!DOCTYPE html>
<html>

<head>

    <title>Phishing Detector</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>🛡️ Phishing URL Detector</h1>

<form method="POST">

<input
type="text"
name="url"
placeholder="Enter website URL"
required>

<button type="submit">

Scan URL

</button>

</form>

{% if result %}

<div class="result">

<h2>Result</h2>

<p><strong>URL:</strong> {{ result.url }}</p>

<p><strong>Prediction:</strong> {{ result.prediction }}</p>

<p><strong>Risk Score:</strong> {{ result.score }}</p>

<h3>Reasons</h3>

<ul>

{% for reason in result.reasons %}

<li>{{ reason }}</li>

{% endfor %}

</ul>

</div>

{% endif %}

</div>

</body>

</html>
