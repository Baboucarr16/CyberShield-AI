<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-label="CyberShield AI cybersecurity shield protecting against phishing threats">
  <defs>
    <radialGradient id="cs-glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity=".38"/>
      <stop offset="55%" stop-color="#3b82f6" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cs-glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity=".30"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cs-shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b3057"/>
      <stop offset="55%" stop-color="#12233f"/>
      <stop offset="100%" stop-color="#0b1528"/>
    </linearGradient>
    <linearGradient id="cs-shieldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9adcff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cs-link" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity=".55"/>
    </linearGradient>
    <pattern id="cs-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#3b82f6" opacity=".22"/>
    </pattern>
    <filter id="cs-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- ambient background glows (transparent canvas: page bg shows through) -->
  <ellipse cx="320" cy="252" rx="245" ry="205" fill="url(#cs-glowCyan)"/>
  <ellipse cx="430" cy="180" rx="150" ry="120" fill="url(#cs-glowViolet)"/>
  <rect x="30" y="60" width="170" height="140" fill="url(#cs-dots)" opacity=".7"/>
  <rect x="470" y="330" width="140" height="120" fill="url(#cs-dots)" opacity=".55"/>

  <!-- orbit rings -->
  <circle cx="320" cy="252" r="152" fill="none" stroke="#3b82f6" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="5 9"/>
  <circle cx="320" cy="252" r="192" fill="none" stroke="#8b5cf6" stroke-opacity=".28" stroke-width="1.5" stroke-dasharray="2 11"/>
  <circle cx="320" cy="252" r="114" fill="none" stroke="#38bdf8" stroke-opacity=".18" stroke-width="1.5"/>

  <!-- network links from hub -->
  <g stroke="url(#cs-link)" stroke-width="1.5" opacity=".8">
    <line x1="320" y1="252" x2="148" y2="148"/>
    <line x1="320" y1="252" x2="182" y2="384"/>
    <line x1="320" y1="252" x2="486" y2="150"/>
    <line x1="320" y1="252" x2="508" y2="356"/>
    <line x1="320" y1="252" x2="112" y2="262"/>
    <line x1="320" y1="252" x2="540" y2="250"/>
    <line x1="320" y1="252" x2="252" y2="82"/>
    <line x1="320" y1="252" x2="418" y2="438"/>
    <path d="M168 384 Q 260 430 330 400" fill="none" stroke-dasharray="4 7"/>
    <path d="M470 150 Q 420 100 340 96" fill="none" stroke-dasharray="4 7"/>
  </g>

  <!-- circuit accents -->
  <g fill="none" stroke="#38bdf8" stroke-opacity=".35" stroke-width="1.5">
    <polyline points="88,420 88,452 140,452"/>
    <polyline points="552,96 552,64 500,64"/>
  </g>
  <circle cx="140" cy="452" r="4" fill="#38bdf8" opacity=".7"/>
  <circle cx="500" cy="64" r="4" fill="#8b5cf6" opacity=".7"/>

  <!-- trusted network nodes -->
  <g>
    <circle cx="148" cy="148" r="11" fill="#38bdf8" opacity=".18"/>
    <circle cx="148" cy="148" r="5.5" fill="#38bdf8"/>
    <circle cx="182" cy="384" r="12" fill="#3b82f6" opacity=".18"/>
    <circle cx="182" cy="384" r="6" fill="#60a5fa"/>
    <circle cx="486" cy="150" r="11" fill="#8b5cf6" opacity=".20"/>
    <circle cx="486" cy="150" r="5.5" fill="#a78bfa"/>
    <circle cx="508" cy="356" r="10" fill="#38bdf8" opacity=".18"/>
    <circle cx="508" cy="356" r="5" fill="#38bdf8"/>
    <circle cx="112" cy="262" r="9" fill="#3b82f6" opacity=".20"/>
    <circle cx="112" cy="262" r="4.5" fill="#60a5fa"/>
    <circle cx="540" cy="250" r="9" fill="#8b5cf6" opacity=".20"/>
    <circle cx="540" cy="250" r="4.5" fill="#a78bfa"/>
    <circle cx="252" cy="82" r="9" fill="#38bdf8" opacity=".20"/>
    <circle cx="252" cy="82" r="4.5" fill="#38bdf8"/>
    <circle cx="418" cy="438" r="9" fill="#3b82f6" opacity=".20"/>
    <circle cx="418" cy="438" r="4.5" fill="#60a5fa"/>
  </g>

  <!-- abstract URL-node chips (no text) -->
  <g opacity=".9">
    <rect x="120" y="300" width="66" height="42" rx="9" fill="#0e1d36" stroke="#38bdf8" stroke-opacity=".55" stroke-width="1.5"/>
    <circle cx="132" cy="312" r="2.6" fill="#38bdf8"/>
    <circle cx="141" cy="312" r="2.6" fill="#38bdf8" opacity=".6"/>
    <circle cx="150" cy="312" r="2.6" fill="#38bdf8" opacity=".35"/>
    <rect x="130" y="322" width="46" height="6" rx="3" fill="#38bdf8" opacity=".5"/>
    <rect x="462" y="196" width="66" height="42" rx="9" fill="#0e1d36" stroke="#8b5cf6" stroke-opacity=".55" stroke-width="1.5"/>
    <circle cx="474" cy="208" r="2.6" fill="#a78bfa"/>
    <circle cx="483" cy="208" r="2.6" fill="#a78bfa" opacity=".6"/>
    <circle cx="492" cy="208" r="2.6" fill="#a78bfa" opacity=".35"/>
    <rect x="472" y="218" width="46" height="6" rx="3" fill="#a78bfa" opacity=".5"/>
  </g>

  <!-- blocked phishing threats -->
  <g>
    <circle cx="96" cy="150" r="13" fill="none" stroke="#f0524f" stroke-width="2" opacity=".9"/>
    <circle cx="96" cy="150" r="5.5" fill="#f0524f"/>
    <line x1="87" y1="141" x2="105" y2="159" stroke="#f0524f" stroke-width="2" stroke-linecap="round"/>
    <circle cx="556" cy="382" r="11" fill="none" stroke="#f0524f" stroke-width="2" opacity=".85"/>
    <circle cx="556" cy="382" r="4.5" fill="#f0524f"/>
    <line x1="549" y1="375" x2="563" y2="389" stroke="#f0524f" stroke-width="2" stroke-linecap="round"/>
    <circle cx="470" cy="452" r="8" fill="none" stroke="#f5a623" stroke-width="1.8" opacity=".8"/>
    <circle cx="470" cy="452" r="3.5" fill="#f5a623"/>
  </g>

  <!-- central shield: glow + body -->
  <path d="M320 118 L428 162 V256 C428 344 380 398 320 426 C260 398 212 344 212 256 V162 Z"
        fill="#3b82f6" opacity=".45" filter="url(#cs-soft)"/>
  <path d="M320 118 L428 162 V256 C428 344 380 398 320 426 C260 398 212 344 212 256 V162 Z"
        fill="url(#cs-shieldFill)" stroke="url(#cs-shieldEdge)" stroke-width="2.5"/>
  <path d="M320 150 L398 184 V254 C398 326 362 370 320 392 C278 370 242 326 242 254 V184 Z"
        fill="none" stroke="#3b82f6" stroke-opacity=".55" stroke-width="1.5"/>
  <ellipse cx="284" cy="205" rx="42" ry="66" fill="#ffffff" opacity=".06" transform="rotate(-18 284 205)"/>
  <path d="M282 254 l28 28 l54 -62" fill="none" stroke="#8fd6ff" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M282 254 l28 28 l54 -62" fill="none" stroke="#e8f6ff" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
</svg>
